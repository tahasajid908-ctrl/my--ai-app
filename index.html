<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USA UK AI App</title>
<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
let ai;
async function load(){
ai = await pipeline('text2text-generation','Xenova/flan-t5-small');
document.getElementById('status').innerText="AI Ready!";
}
load();
window.run = async()=>{
let t=document.getElementById('in').value;
document.getElementById('out').innerText="Loading...";
let r=await ai("paraphrase: "+t);
document.getElementById('out').innerText=r[0].generated_text;
localStorage.setItem("last_text",r[0].generated_text);
}
</script>
</head>
<body style="font-family:sans-serif;padding:15px">
<h2>AI Paraphraser for US UK</h2>
<p id="status">AI is loading...</p>
<textarea id="in" style="width:100%;height:90px" placeholder="Write English here..."></textarea><br><br>
<button onclick="run()" style="width:100%;padding:12px;background:black;color:white;border-radius:10px">Make US English</button>
<div id="out" style="margin-top:15px;padding:10px;border:1px solid #ccc;min-height:50px"></div>
</body>
</html>
